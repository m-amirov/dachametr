name: Local prototype domain engine
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript strict typecheck
        run: npm run typecheck
      - name: Domain and golden fixture tests
        run: npm run test:domain
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: TypeScript and UI unit tests
        run: npm run typecheck && npm run test:ui
      - name: Build local prototype
        run: npm run build
      - name: Critical browser scenarios
        run: npm run test:browser

      - name: Capture source-bound live UI screenshots
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/dachametr-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --silent --fail --output /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:4173/
          EVIDENCE_DIR="$RUNNER_TEMP/dachametr-ui-evidence" npm run capture:evidence
      - name: Upload live screenshots and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dachametr-live-ui-evidence
          path: ${{ runner.temp }}/dachametr-ui-evidence
          retention-days: 30
          if-no-files-found: warn
